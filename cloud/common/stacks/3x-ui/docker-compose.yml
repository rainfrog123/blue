# Shared 3x-ui (panel + Xray). Default DB = SQLite.
# Run: bash cloud/common/stacks/3x-ui/up.sh <host>
# Volumes use XUI_SITE_DIR (absolute), set by up.sh — relative ./ paths break when
# -f points at common/stacks/3x-ui/ while --project-directory is hosts/<host>/3x-ui.

services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: always
    mem_limit: 350m
    volumes:
      - ${XUI_SITE_DIR}/db:/etc/x-ui/
      - ${XUI_SITE_DIR}/cert:/root/cert/
      - ${XUI_SITE_DIR}/acme:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_MEMORY_LIMIT: "320"
    ports:
      - "127.0.0.1:2053:2053"
      - "12033:12033"
      - "12033:12033/udp"
      - "443:443/udp"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    tty: true
    networks:
      - tunnel-net

networks:
  tunnel-net:
    name: init_tunnel-net
    external: true
