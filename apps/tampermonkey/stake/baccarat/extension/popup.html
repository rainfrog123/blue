<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <div class="mark">
        <img src="icons/icon32.png" alt="" width="22" height="22" />
      </div>
      <div class="brand-copy">
        <h1>Stake Baccarat</h1>
        <p>8.2.3 · Multiplay HUD</p>
      </div>
    </header>

    <section class="status" id="status" data-tone="off">
      <span class="dot" aria-hidden="true"></span>
      <div class="status-copy">
        <strong id="status-title">Checking…</strong>
        <span id="status-detail"></span>
      </div>
    </section>

    <div class="actions">
      <button type="button" class="btn primary" id="open">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path
            d="M6 3H4.2A1.2 1.2 0 0 0 3 4.2v7.6A1.2 1.2 0 0 0 4.2 13h7.6A1.2 1.2 0 0 0 13 11.8V10M8 8l5-5m0 0H10m3 0v3"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        Open Stake
      </button>
      <button type="button" class="btn ghost" id="reload">
        Reload HUD
      </button>
    </div>

    <p class="hint">
      HUD lives in the Multiplay iframe. Chrome’s debugger bar is expected.
      Keep the Tampermonkey script off.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
